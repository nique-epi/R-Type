name: Terraform of the game machine
description: >-
  Logs in to AWS as the role of the LAN workflows and gets Terraform ready in
  infra/terraform-game/, with the variables it reads. lan-open and lan-close
  share it, so a variable added to that folder reaches both.

inputs:
  role:
    description: The role to assume, the lan_role_arn output of infra/terraform/
    required: true
  region:
    description: The AWS region of the infrastructure
    required: true
  state-bucket:
    description: The S3 bucket of the Terraform state
    required: true
  master-url:
    description: The url of the master the game servers are listed on
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ inputs.region }}

    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Give Terraform its variables
      shell: sh
      env:
        REGION: ${{ inputs.region }}
        MASTER_URL: ${{ inputs.master-url }}
      run: |
        {
          echo "TF_VAR_region=$REGION"
          echo "TF_VAR_master_url=$MASTER_URL"
          echo "TF_VAR_github_repository=$GITHUB_REPOSITORY"
          echo "TF_VAR_scripts_ref=$GITHUB_SHA"
        } >> "$GITHUB_ENV"

    - name: Read the state of the game machine
      shell: sh
      working-directory: infra/terraform-game
      env:
        REGION: ${{ inputs.region }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        terraform init -input=false \
          -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"
