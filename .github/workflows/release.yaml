name: release

# Publishes a GitHub release for every version tag: the packages of the client
# and the server, built by the package workflow, and notes listing the pull
# requests merged since the previous tag. The message of the annotated tag
# goes into the update packages of the client, which shows it in WHAT'S NEW,
# and at the top of the notes.
on:
  push:
    tags:
      - "v*"

# Read only by default; the publishing job alone may write the release.
permissions:
  contents: read

jobs:
  version:
    name: Check the tag against the project version
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5

      # The package files are named after project(VERSION): a tag naming
      # another version would publish files named after the wrong one.
      - name: Compare the tag with project(VERSION)
        shell: bash
        run: |
          version=$(sed -n -E 's/^project\(r-type VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi

      # actions/checkout fetches the tag as a lightweight one: fetch it again
      # to read its message. A tag without a message gives no notes.
      - name: Read the message of the tag
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          delimiter="notes-$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: version
    uses: ./.github/workflows/package.yaml
    with:
      release-notes: ${{ needs.version.outputs.notes }}
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  publish:
    name: Publish the release
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NOTES: ${{ needs.version.outputs.notes }}
        run: |
          printf '%s\n' "$TAG_NOTES" > "$RUNNER_TEMP/tag-notes.md"
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "R-Type $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/tag-notes.md" \
            --generate-notes \
            --verify-tag

  # Waits for the approval of the "production" environment, then installs the
  # server package of the release on the master instance of AWS.
  deploy-master:
    name: Deploy the master
    needs: publish
    uses: ./.github/workflows/deploy-master.yaml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
