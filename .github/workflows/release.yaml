name: release

# Publishes a GitHub release for every version tag: the packages of the client
# and the server, built by the package workflow, and notes listing the pull
# requests merged since the previous tag.
on:
  push:
    tags:
      - "v*"

# Read only by default; the publishing job alone may write the release.
permissions:
  contents: read

jobs:
  version:
    name: Check the tag against the project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The package files are named after project(VERSION): a tag naming
      # another version would publish files named after the wrong one.
      - name: Compare the tag with project(VERSION)
        shell: bash
        run: |
          version=$(sed -n -E 's/^project\(r-type VERSION ([0-9.]+) .*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi

  package:
    name: Package
    needs: version
    uses: ./.github/workflows/package.yaml
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  # Writes the manifest the clients update from, signed with the key whose
  # public half the client holds (UPDATE_PUBLIC_KEY), and the notes of the
  # tag message, which WHAT'S NEW shows after the update.
  update-manifest:
    name: Sign the update manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # actions/checkout fetches the commit, not the annotation of the tag:
      # fetch the tag object itself to read its message.
      - name: Read the message of the tag
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > tag-notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      - name: Write and sign the manifest
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -I packaging/update-manifest.py "$version" tag-notes.md packages update-manifest.json
          key_file="$RUNNER_TEMP/update-signing.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file"
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in update-manifest.json -out update-manifest.sig
          rm -f "$key_file"
          test "$(wc -c < update-manifest.sig)" -eq 64

      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: |
            update-manifest.json
            update-manifest.sig
            tag-notes.md
          retention-days: 7

  publish:
    name: Publish the release
    needs: [package, update-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: update-manifest
          path: manifest

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" packages/* manifest/update-manifest.json manifest/update-manifest.sig
          --repo "$GITHUB_REPOSITORY"
          --title "R-Type $GITHUB_REF_NAME"
          --notes-file manifest/tag-notes.md
          --generate-notes
          --verify-tag

  # Waits for the approval of the "production" environment, then installs the
  # server package of the release on the master instance of AWS.
  deploy-master:
    name: Deploy the master
    needs: publish
    uses: ./.github/workflows/deploy-master.yaml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
