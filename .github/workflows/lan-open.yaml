name: lan-open

# Opens a LAN: stops the test game server of the master machine, creates the
# game machine with Terraform (infra/terraform-game/), and waits until every
# server of its pool is listed online on the master. Run by hand; lan-close undoes
# it. The game machine is billed from here until lan-close.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan
  cancel-in-progress: false

jobs:
  open:
    name: Open the LAN
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The AWS role only trusts this environment, which asks for an approval.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      MASTER_INSTANCE_ID: ${{ vars.MASTER_INSTANCE_ID }}
      MASTER_URL: ${{ vars.MASTER_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/game-machine-terraform
        with:
          role: ${{ vars.AWS_LAN_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
          master-url: ${{ vars.MASTER_URL }}

      # Its players would stay on the small machine of the master, and Quick
      # Play could send new ones there.
      - name: Stop the test server of the master machine
        run: |
          cat > "$RUNNER_TEMP/script.sh" <<'SCRIPT'
          if systemctl cat rtype-test-server > /dev/null 2>&1; then
            systemctl disable --now rtype-test-server
          fi
          SCRIPT
          infra/run-on-instance.sh "$MASTER_INSTANCE_ID" "$RUNNER_TEMP/script.sh"

      - name: Create the game machine
        working-directory: infra/terraform-game
        run: |
          terraform apply -input=false -auto-approve
          echo "GAME_ADDRESS=$(terraform output -raw public_ip)" >> "$GITHUB_ENV"
          echo "SERVER_COUNT=$(terraform output -raw server_count)" >> "$GITHUB_ENV"

      # The machine installs the latest release, then starts every server
      # of its pool, and each one registers on the master.
      - name: Wait for its servers on the master
        run: |
          online=0
          for _ in $(seq 1 90); do
            online=$(infra/game-servers/listed-servers.sh "$MASTER_URL" "$GAME_ADDRESS" 2> /dev/null |
              grep -c ' online ' || true)
            if [ "$online" -ge "$SERVER_COUNT" ]; then
              echo "the LAN is open: $online servers are online at $GAME_ADDRESS"
              exit 0
            fi
            sleep 10
          done
          echo "$online of $SERVER_COUNT servers of $GAME_ADDRESS are online after 15 minutes; run lan-close to destroy the machine" >&2
          exit 1
