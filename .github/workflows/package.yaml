name: package

# Builds the packages of the client and the server on Linux, Windows and
# macOS, checks them from another folder, and uploads them as artifacts.
# Called by the pull request workflow and by the release workflow, so a release
# ships exactly what the pull requests checked. When the callers pass the Apple
# credentials, the macOS client is signed with the Developer ID certificate and
# notarized; without them (a pull request from a fork), it is signed without an
# identity, as before.
on:
  workflow_call:
    inputs:
      release-notes:
        description: Markdown notes of the release, shown by the updated client
        type: string
        required: false
        default: ""
    secrets:
      MACOS_CERTIFICATE_P12:
        description: Developer ID Application certificate and its key, as a base64 .p12
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: Password of the .p12
        required: false
      APPLE_API_KEY_P8:
        description: App Store Connect API key, the text of its .p8 file
        required: false
      APPLE_API_KEY_ID:
        description: Identifier of the App Store Connect API key
        required: false
      APPLE_API_ISSUER_ID:
        description: Issuer of the App Store Connect API key
        required: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest image GitHub offers: a Linux binary needs a C library
          # at least as recent as the one it was built against, so building
          # on Ubuntu 22.04 (glibc 2.35) lets it run on 22.04, Debian 12 and
          # newer.
          - os: ubuntu-22.04
            generator_arguments: ""
          - os: windows-latest
            # Ninja compiles every file in parallel; the Visual Studio generator does not.
            generator_arguments: >-
              -G Ninja
              -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          - os: macos-latest
            generator_arguments: ""
    env:
      # The runners have no FUSE: an AppImage extracts itself instead of
      # mounting.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # vpk packs the client so it can update itself (packaging/VelopackClient.cmake);
      # the same version as the library of ports/velopack.
      VELOPACK_VERSION: "1.2.161"
      RTYPE_REQUIRE_VELOPACK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake 4.2
        uses: lukka/get-cmake@v4.2.3

      # One archive per job, restored and saved whole (see build-and-test.yaml).
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: package-${{ matrix.os }}
          max-size: 1G
          evict-old-files: job
          job-summary: ""

      # GCC 12, installed on the image, ships the C++ runtime of Ubuntu 22.04
      # and Debian 12; the default GCC 11 never built this project.
      - name: Use GCC 12
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y

      # vpk is a .NET tool.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install -g vpk --version "$VELOPACK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Written to a file, which vpk puts in the update package; the client
      # shows it in WHAT'S NEW once updated.
      - name: Write the notes of the release
        if: inputs.release-notes != ''
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "RTYPE_RELEASE_NOTES=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Point vcpkg at a local binary cache
        shell: bash
        run: |
          cmake -E make_directory "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          # A key of its own, per image: this job builds no test dependency,
          # and its Linux image is older than the one of the test jobs.
          key: vcpkg-release-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-release-${{ matrix.os }}-

      # Warnings are not errors here: the build-and-test jobs hold the code to
      # zero warnings with GCC 13 and MSVC, and GCC 12 adds false positives of
      # its own (maybe-uninitialized in std::optional, unused constexpr arrays
      # of a header).
      - name: Configure
        shell: bash
        env:
          VCPKG_SSL_REVOKE_BEST_EFFORT: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: >-
          cmake --preset default ${{ matrix.generator_arguments }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset default --parallel

      # The certificate goes into a keychain of its own, deleted at the end of
      # the job; the identity is named by its hash, so no other certificate of
      # the runner can be picked.
      - name: Import the Developer ID certificate
        id: signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No Developer ID certificate: the client is signed without an identity."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n -E 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "The certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "RTYPE_MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
            printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
            {
              echo "RTYPE_NOTARY_KEY=$RUNNER_TEMP/notary-key.p8"
              echo "RTYPE_NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "RTYPE_NOTARY_ISSUER=$NOTARY_ISSUER_ID"
              echo "RTYPE_EXPECT_NOTARIZED=1"
            } >> "$GITHUB_ENV"
          fi

      - name: Package the client
        run: cpack --preset client

      - name: Package the server
        run: cpack --preset server

      - name: Launch the packaged programs from another folder
        shell: bash
        run: sh tests/tools/packaging/check-package.sh build

      - name: Delete the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          # The client is published as vpk packed it, and as a disk image on
          # macOS; its archives, which cannot update, stay in the job.
          path: |
            build/R-Type-server-*.tar.gz
            build/R-Type-server-*.zip
            build/R-Type-server-*.exe
            build/R-Type-client-*.dmg
            build/R-Type-client-*.exe
            build/R-Type-client-*.AppImage
            build/velopack/R-Type-*-full.nupkg
            build/velopack/releases.*.json
          if-no-files-found: error
          retention-days: 7
