name: build and test

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: apt-get update && apt-get install -y clang-format-20

      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format-20 --dry-run -Werror

  tidy:
    name: Clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev

      - name: Install clang-tidy
        run: |
          wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 20
          sudo apt-get install -y clang-tidy-20

      - name: Point vcpkg at a local binary cache
        run: |
          cmake -E make_directory "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset test

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Select the files to lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          lint_everything() {
            find src tests -name '*.cpp' -print0 > "$RUNNER_TEMP/files-to-lint"
          }
          if [ -z "$BASE_SHA" ]; then
            lint_everything
          elif git diff --name-only "$BASE_SHA"...HEAD \
              | grep -qE '\.hpp$|^\.clang-tidy$|CMakeLists\.txt$|^CMakePresets\.json$|^vcpkg\.json$'; then
            lint_everything
          else
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA"...HEAD -- 'src/*.cpp' 'tests/*.cpp' \
              > "$RUNNER_TEMP/files-to-lint"
          fi
          jq -r --arg root "$GITHUB_WORKSPACE/" '.[].file | ltrimstr($root)' build/compile_commands.json \
            | sort -u > "$RUNNER_TEMP/compiled-files"
          tr '\0' '\n' < "$RUNNER_TEMP/files-to-lint" | sort -u > "$RUNNER_TEMP/selected-files"
          echo "Files the Linux build does not compile, linted elsewhere:"
          comm -23 "$RUNNER_TEMP/selected-files" "$RUNNER_TEMP/compiled-files"
          comm -12 "$RUNNER_TEMP/selected-files" "$RUNNER_TEMP/compiled-files" \
            | tr '\n' '\0' > "$RUNNER_TEMP/files-to-lint"
          echo "Files to lint:"
          tr '\0' '\n' < "$RUNNER_TEMP/files-to-lint"

      - name: Run clang-tidy
        run: |
          if [ ! -s "$RUNNER_TEMP/files-to-lint" ]; then
            echo "No C++ file to lint."
            exit 0
          fi
          xargs -0 -a "$RUNNER_TEMP/files-to-lint" clang-tidy-20 -p build --quiet

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev

      - name: Point vcpkg at a local binary cache
        shell: bash
        run: |
          cmake -E make_directory "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        env:
          VCPKG_SSL_REVOKE_BEST_EFFORT: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cmake --preset test -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset test

      - name: Test
        run: ctest --preset test

  mirror:
    name: Push to Epitech mirror
    runs-on: ubuntu-latest
    needs: [format-check, tidy, build]
    if: github.event_name == 'push' && github.repository == 'nique-epi/R-Type'
    env:
      MIRROR_URL: git@github.com:EpitechPGE3-2026/G-ING-500-NAN-5-1-rtype-1.git
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up SSH for the mirror
        env:
          SSH_KEY: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push every branch and tag to the mirror
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
        run: >-
          git push --force --prune "$MIRROR_URL"
          "refs/remotes/origin/*:refs/heads/*"
          "refs/tags/*:refs/tags/*"
