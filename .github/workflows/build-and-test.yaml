name: build and test

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The wheel of PyPI ships the same clang-format 20.1.8 as the Epitech image,
      # without pulling that image.
      - name: Install clang-format
        run: |
          pipx install clang-format==20.1.8
          clang-format --version

      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run -Werror

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CI never runs a debugger, so the debug builds carry no debug
          # information: the objects, the compiler cache and the links shrink.
          - os: ubuntu-latest
            preset: test
            debug_arguments: >-
              -DCMAKE_C_FLAGS_DEBUG=-O0
              -DCMAKE_CXX_FLAGS_DEBUG=-O0
          - os: windows-latest
            preset: test
            debug_arguments: >-
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=
              -DCMAKE_EXE_LINKER_FLAGS_DEBUG=/INCREMENTAL:NO
              -DCMAKE_SHARED_LINKER_FLAGS_DEBUG=/INCREMENTAL:NO
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake 4.2
        uses: lukka/get-cmake@v4.2.3

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev

      # One archive per job, restored and saved whole: the cache of a pull
      # request falls back to the newest one of main. In depend mode, ccache
      # takes the headers of an MSVC compile from /showIncludes instead of
      # running the preprocessor.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.preset }}
          max-size: 1G
          evict-old-files: job
          job-summary: ""

      - name: Point ccache at depend mode
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"

      - name: Point vcpkg at a local binary cache
        shell: bash
        run: |
          cmake -E make_directory "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          # vcpkg reuses a cached package only when its compiler and ports match,
          # so the key names the runner image and the vcpkg commit: a new image
          # or a moved submodule gives a new key, which the save step then fills.
          echo "VCPKG_CACHE_STAMP=${ImageOS}-${ImageVersion}-$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_ENV"
          # github.com answers the runners 503 for the patches a port fetches from
          # a commit page; vcpkg takes a file already in its downloads folder once
          # its SHA512 matches the portfile, and downloads it otherwise.
          cmake -E copy_directory .github/vcpkg-downloads vcpkg/downloads

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_CACHE_STAMP }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.VCPKG_CACHE_STAMP }}-

      # Ninja compiles every file in parallel, on every platform.
      - name: Configure
        shell: bash
        env:
          VCPKG_SSL_REVOKE_BEST_EFFORT: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: >-
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          ${{ matrix.debug_arguments }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true' && matrix.preset == 'test'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Show the compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel

  mirror:
    name: Push to Epitech mirror
    runs-on: ubuntu-latest
    needs: [format-check, build]
    if: github.event_name == 'push' && github.repository == 'nique-epi/R-Type'
    env:
      MIRROR_URL: git@github.com:EpitechPGE3-2026/G-ING-500-NAN-5-1-rtype-1.git
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up SSH for the mirror
        env:
          SSH_KEY: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push every branch and tag to the mirror
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
        run: >-
          git push --force --prune "$MIRROR_URL"
          "refs/remotes/origin/*:refs/heads/*"
          "refs/tags/*:refs/tags/*"
