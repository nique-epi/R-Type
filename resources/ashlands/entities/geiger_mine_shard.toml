# The entity type geiger_mine_shard, brought by the resource ashlands:
# a shard of a Geiger mine, flying straight away from it.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy_missile"
layer = "enemy_missile"
hits = ["player"]
pilot = "scatter"

[gameplay.hitbox]
width = 28
height = 28

[gameplay.motion]
kind = "steady"
top_speed = 380

[appearance]
sheet = "sprites/cendres/geiger_mine_shard.png"

[appearance.idle]
left = 0
top = 0
width = 7
height = 7
frames = 2
spacing = 2
frame_ms = 60
