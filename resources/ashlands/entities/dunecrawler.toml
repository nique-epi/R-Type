# The entity type dunecrawler, brought by the resource ashlands:
# a scorpion the size of a car, walking left along the floor, that stings
# straight up at a ship flying above it.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "dunecrawler_walk"

[gameplay.hitbox]
width = 176
height = 120

[gameplay.motion]
kind = "steady"
top_speed = 110

# It fires a barb at a ship within 140 units of its column, rested 1.6 s;
# the beats match its animations.
[gameplay.behaviour]
reach = 140
rest_ms = 1600
signal_ms = 480
strike_ms = 240
recover_ms = 360

[gameplay.health]
points = 3

[gameplay.score]
points = 200

[appearance]
sheet = "sprites/cendres/dunecrawler.png"

[appearance.idle]
left = 0
top = 0
width = 44
height = 30
frames = 4
spacing = 2
frame_ms = 140

[appearance.attack_0.signal]
left = 0
top = 32
width = 44
height = 30
frames = 2
spacing = 2
frame_ms = 120
playback = "loop"
afterwards = "stay"

[appearance.attack_0.strike]
left = 0
top = 64
width = 44
height = 30
frames = 3
spacing = 2
frame_ms = 80
playback = "once"
afterwards = "idle"

[appearance.attack_0.recover]
left = 0
top = 96
width = 44
height = 30
frames = 2
spacing = 2
frame_ms = 180
playback = "once"
afterwards = "idle"

[appearance.death]
left = 0
top = 128
width = 60
height = 60
frames = 6
spacing = 2
frame_ms = 70
