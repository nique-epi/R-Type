# The entity type glowheart, brought by the resource ashlands:
# the reactor of the shelter grown alive, the boss of the core, steered by
# server/glowheart.luau.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "glowheart_core"

# Its armoured vessel; only the rows of its core window let a hit through,
# while it does not attack.
[gameplay.hitbox]
width = 280
height = 320
offset_x = 48
offset_y = -14

[gameplay.motion]
kind = "steady"
top_speed = 400

# It slides to x 1644 over 2.4 s, rests 1.1 s between two attacks, 0.5 s
# once enraged, holds 1.5 s as it enrages, purges 2 s after a Meltdown, and
# spits 3 mites in its Overload (5 enraged), 0.2 s apart.
[gameplay.behaviour]
rest_x = 1644
slide_ms = 2400
rest_ms = 1100
enraged_rest_ms = 500
rage_ms = 1500
purge_ms = 2000
mites = 3
enraged_mites = 5
mite_gap_ms = 200

[gameplay.health]
points = 80

[gameplay.score]
points = 15000

[gameplay.boss]
rage_below_percent = 50
rage_attack = 4
arrival_attack = 3

[gameplay.stays_outside]

[gameplay.survives_contact]

# The roots of its tendrils hurt in front of the vessel as the Tendrils
# (attack 0) sweep; its arms stay as they rest, the tendrils growing out of
# their tips.
[[gameplay.hurt_zone.box]]
offset_x = -200
offset_y = 0
width = 160
height = 360
attack = 0
phase = "strike"

# The Meltdown (attack 2) burns its row, from the vessel to the left edge.
[[gameplay.hurt_zone.beam]]
offset_x = -92
offset_y = -12
length = 1500
thickness = 56
from_deg = 0
to_deg = 0
attack = 2
phase = "strike"

[appearance]
sheet = "sprites/cendres/glowheart.png"
boss_name = "THE GLOWHEART"

