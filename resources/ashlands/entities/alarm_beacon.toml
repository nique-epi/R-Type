# The entity type alarm_beacon, brought by the resource ashlands:
# the red alarm beacon of the shelter, hanging from its ceiling; it spins
# as the shelter wakes up and a wave of Fixbots rolls out of the dormitory.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "obstacle"
layer = "decor"
pilot = "alarm_wake"

[gameplay.hitbox]
width = 104
height = 64

[gameplay.motion]
kind = "scroll"

# It wakes once left of x 1500 and sends 2 Fixbots.
[gameplay.behaviour]
wake_x = 1500
fixbots = 2

[gameplay.obstacle]
contact = "blocking"

[appearance]
sheet = "sprites/cendres/alarm_beacon.png"

# Idle: the beacon, off, hanging from the ceiling.
[appearance.idle]
left = 0
top = 0
width = 26
height = 16
frames = 1
spacing = 2
frame_ms = 1000

# Spinning: its red ray turns round, left then right, while the shelter wakes up.
[appearance.looks.spinning]
left = 0
top = 18
width = 26
height = 16
frames = 4
spacing = 2
frame_ms = 110
