# The entity type blast_door, brought by the resource ashlands:
# the upper half of a blast door, closed down to the gap its door leaves.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "obstacle"
layer = "wall"
# It stops the ships, and the missiles of the players and of the Bydos.
hits = ["player", "player_missile", "enemy_missile"]
pilot = "blast_door_hold"

[gameplay.hitbox]
width = 88
height = 480

[gameplay.motion]
kind = "scroll"


[gameplay.obstacle]
contact = "blocking"

[appearance]
sheet = "sprites/cendres/blast_door.png"

# Idle: the upper half of a blast door, its edge striped.
[appearance.idle]
left = 0
top = 0
width = 22
height = 120
frames = 1
spacing = 2
frame_ms = 1000
