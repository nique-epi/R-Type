# The entity type coolant_leak, brought by the resource ashlands:
# a cracked ceiling pipe that drips green coolant on the ships below;
# it lights up with the charge of the Meltdown of the Glowheart.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "obstacle"
layer = "decor"
pilot = "coolant_drip"

[gameplay.hitbox]
width = 80
height = 120

[gameplay.motion]
kind = "scroll"

# It lets a drop fall every 2.8 s.
[gameplay.behaviour]
drip_ms = 2800

[gameplay.obstacle]
contact = "blocking"

[appearance]
sheet = "sprites/cendres/coolant_leak.png"

# Idle: the cracked pipe, green coolant dripping from it.
[appearance.idle]
left = 0
top = 0
width = 20
height = 30
frames = 2
spacing = 2
frame_ms = 220

# Lit: the leak glows with the charge of the Meltdown of the Glowheart.
[appearance.looks.lit]
left = 0
top = 32
width = 20
height = 30
frames = 2
spacing = 2
frame_ms = 110
