# The entity type rad_geyser, brought by the resource ashlands:
# a radioactive puddle on the floor that bubbles, then spurts a green
# column up through the band.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "hazard"
hits = ["player"]
pilot = "hazard_cycle"

# Nothing collides with its body: only its hurt zone hurts.
[gameplay.hitbox]
width = 4
height = 4
offset_y = 1024

[gameplay.motion]
kind = "scroll"

# It first spurts 0.6 s after it shows, then rests 1.8 s, bubbles 0.7 s,
# spurts 0.9 s and settles 0.24 s.
[gameplay.behaviour]
first_ms = 600
idle_ms = 1800
signal_ms = 700
strike_ms = 900
recover_ms = 240

[gameplay.survives_contact]

# The column hurts while it spurts.
[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = -12
width = 40
height = 376
attack = 0
phase = "strike"

[appearance]
sheet = "sprites/cendres/rad_geyser.png"

# Idle: the mouth at rest on the floor.
[appearance.idle]
left = 0
top = 0
width = 16
height = 100
frames = 1
spacing = 2
frame_ms = 1000

# Signal: it bubbles before it spurts.
[appearance.attack_0.signal]
left = 0
top = 102
width = 16
height = 100
frames = 2
spacing = 2
frame_ms = 140
playback = "loop"
afterwards = "stay"

# Strike: a green column spurts up through the band.
[appearance.attack_0.strike]
left = 0
top = 204
width = 16
height = 100
frames = 3
spacing = 2
frame_ms = 90
playback = "loop"
afterwards = "stay"

# Recover: the column falls back.
[appearance.attack_0.recover]
left = 0
top = 306
width = 16
height = 100
frames = 2
spacing = 2
frame_ms = 120
playback = "once"
afterwards = "idle"
