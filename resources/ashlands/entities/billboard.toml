# The entity type billboard, brought by the resource ashlands:
# a faded roadside billboard on two rusted legs; shot, it falls across
# the floor and crushes what walks there.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "breakable_watch"
on_hit = "billboard_fall"

[gameplay.hitbox]
width = 136
height = 120

[gameplay.motion]
kind = "scroll"

[gameplay.health]
points = 4

[gameplay.score]
points = 200

[appearance]
sheet = "sprites/cendres/billboard.png"

# Idle: the faded billboard on its two rusted legs.
[appearance.idle]
left = 0
top = 0
width = 34
height = 30
frames = 1
spacing = 2
frame_ms = 1000
