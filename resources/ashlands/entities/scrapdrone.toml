# The entity type scrapdrone, brought by the resource ashlands:
# a chrome patrol drone that drifts in, rests in the air and fires at the
# nearest ship each time it rested.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "scrapdrone_patrol"

[gameplay.hitbox]
width = 120
height = 104

[gameplay.motion]
kind = "steady"
top_speed = 100

# It bobs 40 units every 1.8 s, and fires once left of x 1760, rested
# 1.4 s; the beats match its animations.
[gameplay.behaviour]
bob = 40
bob_ms = 1800
fire_from_x = 1760
rest_ms = 1400
signal_ms = 360
strike_ms = 240
recover_ms = 360

[gameplay.health]
points = 3

[gameplay.score]
points = 250

[appearance]
sheet = "sprites/cendres/scrapdrone.png"

[appearance.idle]
left = 0
top = 0
width = 30
height = 26
frames = 4
spacing = 2
frame_ms = 140

[appearance.attack_0.signal]
left = 0
top = 28
width = 30
height = 26
frames = 2
spacing = 2
frame_ms = 120
playback = "loop"
afterwards = "stay"

[appearance.attack_0.strike]
left = 0
top = 56
width = 30
height = 26
frames = 3
spacing = 2
frame_ms = 80
playback = "once"
afterwards = "idle"

[appearance.attack_0.recover]
left = 0
top = 84
width = 30
height = 26
frames = 2
spacing = 2
frame_ms = 180
playback = "once"
afterwards = "idle"

[appearance.death]
left = 0
top = 112
width = 46
height = 46
frames = 6
spacing = 2
frame_ms = 70
