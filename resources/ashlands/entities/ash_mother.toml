# The entity type ash_mother, brought by the resource ashlands:
# the queen of the cindermites, the final boss of the Ashlands, steered by
# server/ash_mother.luau.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "ash_mother_brood"

# Her head and her body; only the rows of her open maw let a hit through.
[[gameplay.hitbox.box]]
width = 160
height = 150
offset_x = -122
offset_y = 29

[[gameplay.hitbox.box]]
width = 330
height = 240
offset_x = 123
offset_y = 24

[gameplay.motion]
kind = "steady"
top_speed = 900

# She climbs to y 620 over 2 s, rests 1 s between two attacks, 0.45 s
# once enraged, spreads her wings 1.5 s as she enrages, and her brood
# holds 5 mites, 8 enraged.
[gameplay.behaviour]
rest_y = 620
rise_ms = 2000
rest_ms = 1000
enraged_rest_ms = 450
rage_ms = 1500
brood = 5
enraged_brood = 8

[gameplay.health]
points = 100

[gameplay.score]
points = 20000

[gameplay.boss]
rage_below_percent = 40
rage_attack = 4
arrival_attack = 3

[gameplay.stays_outside]

[gameplay.survives_contact]

# The Scythes (attack 0) slam across the lower front as they land.
[[gameplay.hurt_zone.box]]
offset_x = -420
offset_y = 140
width = 640
height = 300
attack = 0
phase = "strike"
from_ms = 0
until_ms = 240

# The Atomic breath (attack 1) burns her row from her maw to the left edge.
[[gameplay.hurt_zone.beam]]
offset_x = -190
offset_y = 64
length = 1500
thickness = 64
from_deg = 0
to_deg = 0
attack = 1
phase = "strike"

