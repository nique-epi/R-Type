# The entity type glowheart_tendril, brought by the resource ashlands:
# a tendril of the Glowheart, swept along one lane of the core.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "boss_effect"
hits = ["player"]
pilot = "lingering_effect"

# Nothing collides with its body: only its hurt zone hurts.
[gameplay.hitbox]
width = 4
height = 4
offset_y = 1024

[gameplay.motion]
kind = "steady"
top_speed = 1

# It shows where it will sweep for 1.2 s, the signal of the Tendrils,
# then sweeps 0.9 s.
[gameplay.behaviour]
strike_after_ms = 1200
life_ms = 2100

[gameplay.survives_contact]

# The tendril hurts its whole lane while it sweeps: its left half, then
# its right half, a box being 1024 units at most.
[[gameplay.hurt_zone.box]]
offset_x = -400
offset_y = 0
width = 800
height = 96
attack = 0
phase = "strike"

# Its right half.
[[gameplay.hurt_zone.box]]
offset_x = 400
offset_y = 0
width = 800
height = 96
attack = 0
phase = "strike"

[appearance]
sheet = "sprites/cendres/glowheart_tendril.png"

# Idle: a tendril of the Glowheart, swept along its lane, writhing.
[appearance.idle]
left = 0
top = 0
width = 400
height = 28
frames = 2
spacing = 2
frame_ms = 90

# Aim: a dashed green line where the tendril will sweep.
[appearance.looks.aim]
left = 0
top = 30
width = 400
height = 28
frames = 2
spacing = 2
frame_ms = 120
