# The entity type necromancer, brought by the resource fosse:
# the boss of the Pit, steered by server/necromancer.luau.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "necromancer_rite"

# The hood and the cape; its script lets a hit apply on the mask only.
[[gameplay.hitbox.box]]
width = 420
height = 320
offset_x = 16
offset_y = -262

[[gameplay.hitbox.box]]
width = 740
height = 520
offset_x = 36
offset_y = 158

[gameplay.motion]
kind = "steady"
top_speed = 900

# It slides to x 1354 over 1.4 s, rests 0.9 s between two attacks, 0.4 s once
# enraged, and hides 2 s in its hood when it enrages.
[gameplay.behaviour]
rest_x = 1354
slide_ms = 1400
rest_ms = 900
enraged_rest_ms = 400
rage_ms = 2000

[gameplay.health]
points = 300

[gameplay.score]
points = 12000

[gameplay.boss]
rage_below_percent = 50
rage_attack = 4
arrival_attack = 5

[gameplay.stays_outside]

[gameplay.survives_contact]

# The fist (attack 1) crushes a column the whole height of the playfield as it
# lands, the first 333 ms of its strike.
[[gameplay.hurt_zone.box]]
offset_x = -746
offset_y = 58
width = 320
height = 720
attack = 1
phase = "strike"
from_ms = 0
until_ms = 333

# The gaze (attack 3) burns a band at the height of its eyes, from the mask to
# the left edge, the whole strike.
[[gameplay.hurt_zone.beam]]
offset_x = -42
offset_y = -190
length = 1312
thickness = 96
from_deg = 0
to_deg = 0
attack = 3
phase = "strike"

[appearance]
sheet = "sprites/fosse/necromancer.png"

# Idle: it bobs, the halo turns, the smoke rolls, the hands breathe out of
# phase.
[appearance.idle]
left = 0
top = 0
width = 283
height = 219
frames = 12
spacing = 2
frame_ms = 83

# Phase 2, below half its health: pink halo and mask, swollen smoke, a second
# pair of hands.
[appearance.enraged_idle]
left = 0
top = 221
width = 288
height = 229
frames = 12
spacing = 2
frame_ms = 83

