# The entity type gloomwyrm_segment, brought by the resource fosse: a vertebra
# of the Gloomwyrm, steered by server/gloomwyrm.luau. It follows the path of
# its skull; a few shots break it, and the wyrm swims on without it. Once the
# skull is killed, every vertebra left bursts, one after the other.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "gloomwyrm_body"

[gameplay.hitbox]
width = 56
height = 56

[gameplay.motion]
kind = "steady"
top_speed = 360

[gameplay.health]
points = 3

[gameplay.score]
points = 100

[gameplay.survives_contact]

[appearance]
sheet = "sprites/fosse/gloomwyrm_segment.png"

# Idle: its core pulses.
[appearance.idle]
left = 0
top = 0
width = 18
height = 18
frames = 8
spacing = 2
frame_ms = 60

# The burst it plays when the death of the skull blows the wyrm apart; its
# version without flash is the row under it.
[appearance.effects.burst]
left = 0
top = 20
width = 24
height = 24
frames = 6
spacing = 2
frame_ms = 70
