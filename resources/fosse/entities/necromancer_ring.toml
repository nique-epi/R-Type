# The entity type necromancer_ring, brought by the resource fosse:
# a ring a hand of the Necromancer throws; it stops missiles.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "necromancer_ring"

[gameplay.hitbox]
width = 140
height = 148

[gameplay.motion]
kind = "steady"
top_speed = 1100

# Out along its lane to x 96, back along the middle lane to x 1000.
[gameplay.behaviour]
turn_x = 96
middle_y = 544
return_x = 1000

[gameplay.survives_contact]

[appearance]
sheet = "sprites/fosse/necromancer_ring.png"

# Idle: a ring thrown by a hand, spinning as it flies.
[appearance.idle]
left = 0
top = 0
width = 35
height = 37
frames = 9
spacing = 2
frame_ms = 166
