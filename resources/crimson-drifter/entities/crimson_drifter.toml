# The entity type crimson_drifter, brought by the resource crimson-drifter: a
# Drifter that crosses the playfield faster, takes more hits and is worth more.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
pilot = "straight"

[gameplay.hitbox]
width = 96
height = 96

[gameplay.motion]
kind = "steady"
top_speed = 360

[gameplay.behaviour]
heading = -1

[gameplay.health]
points = 5

[gameplay.score]
points = 250

[gameplay.gun]
interval_ms = 1500
first_shot_ms = 1500
projectile = "enemy_missile"

[appearance]
sheet = "sprites/crimson-drifter/crimson_drifter.png"

[appearance.idle]
left = 0
top = 0
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 250
