# The entity type crimson_drifter, brought by the resource crimson-drifter: a
# Drifter that charges a ship level with it, steered by the script
# server/charge.luau, takes more hits and is worth more.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "crimson_charge"

[gameplay.hitbox]
width = 96
height = 96

[gameplay.motion]
kind = "steady"
top_speed = 360

# The settings of server/charge.luau: it charges a ship within 96 units of
# its row at 720 units per second, and cruises at 360 otherwise.
[gameplay.behaviour]
align_range = 96
cruise_speed = 360
charge_speed = 720

[gameplay.health]
points = 5

[gameplay.score]
points = 250

[gameplay.gun]
interval_ms = 1500
first_shot_ms = 1500
projectile = "enemy_missile"

[appearance]
sheet = "sprites/crimson-drifter/crimson_drifter.png"

[appearance.idle]
left = 0
top = 0
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 250
