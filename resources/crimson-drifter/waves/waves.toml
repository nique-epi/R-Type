# The waves of the resource crimson-drifter: only what it changes in the
# waves of the assets. The server lays this file over assets/waves/waves.toml:
# a key given here replaces the same key of that difficulty, a key left out
# keeps the value of the assets, and a list is replaced whole. Here the
# enemies of normal take the crimson Drifter twice; its boss, its look items
# and the other difficulties stay those of the assets. The keys are those of
# assets/waves/waves.toml.

[difficulty.normal]
enemies = ["drifter", "weaver", "crimson_drifter", "voltjelly", "weaver", "reaper", "crimson_drifter"]
