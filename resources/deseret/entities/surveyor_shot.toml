# The entity type surveyor_shot, brought by the resource deseret:
# the slug of the Surveyor, flying left along its sight.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy_missile"
layer = "enemy_missile"
hits = ["player"]
pilot = "flying_left"

[gameplay.hitbox]
width = 56
height = 12

[gameplay.motion]
kind = "steady"
top_speed = 1400

[appearance]
sheet = "sprites/deseret/surveyor_shot.png"

# Idle: the slug and its streak.
[appearance.idle]
left = 0
top = 0
width = 6
height = 3
frames = 2
spacing = 2
frame_ms = 60
