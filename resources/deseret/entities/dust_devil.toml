# The entity type dust_devil, brought by the resource deseret:
# a dust devil torn from the ground; it cannot be killed, swallows the shots
# that cross it, and is gone after six seconds.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
pilot = "dust_drift"

[gameplay.hitbox]
width = 96
height = 136

[gameplay.motion]
kind = "steady"
top_speed = 140

# It drifts left, swaying 60 units every 2 s, swallows every missile, shows
# its lighter frame for its last second, and is gone after 6 s.
[gameplay.behaviour]
sway = 60
sway_ms = 2000
life_ms = 6000
warn_ms = 1000

# It has health so missiles meet it; its pre_hit refuses every hit, so it
# never dies and draws no death.
[gameplay.health]
points = 1

[gameplay.survives_contact]

[appearance]
sheet = "sprites/deseret/dust_devil.png"

# Idle: the bands of sand slide a notch, the debris turn a quarter.
[appearance.idle]
left = 0
top = 0
width = 24
height = 34
frames = 4
spacing = 2
frame_ms = 90

# Signal: its lighter frame, for its last second.
[appearance.attack_0.signal]
left = 104
top = 0
width = 24
height = 34
frames = 1
spacing = 2
frame_ms = 1000
playback = "loop"
afterwards = "stay"
