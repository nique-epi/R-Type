# The entity type old_widow, brought by the resource deseret:
# the windpump of an abandoned farm at the top of the mesa, its wheel of
# blades a Bydo eye. It blows sand, throws its blades, pumps oil out of the
# ground and, enraged, tears its veil. A missile that touches its wheel, its
# tower or its vane hurts it, at any time.
# Only the server reads [gameplay]; a client draws [appearance] from the
# content pack the supervisor serves. The keys are described on the page
# "Writing an entity sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "old_widow_turn"

# Its wheel, its tower and the vane of its tail.
[[gameplay.hitbox.box]]
width = 224
height = 232
offset_x = -32
offset_y = -180

[[gameplay.hitbox.box]]
width = 176
height = 376
offset_x = -24
offset_y = 124

[[gameplay.hitbox.box]]
width = 144
height = 64
offset_x = 152
offset_y = -176

[gameplay.motion]
kind = "steady"
top_speed = 1

# It rises out of the mesa (its arrival, 1.32 s) where it rests, its feet on
# the ground under it (y 620 where the biome gives none); rested 1.2 s (0.6 s
# enraged), it takes its attacks in turn: the gale blows sand along 2 lanes of
# 5 for 1.2 s, the blades fly to the left edge and back, the pump cracks the
# ground under the nearest ship and at two other places 1.4 s before their
# geysers; enraged, its veil tears
# into 6 tatters that stop the shots while it blows.
[gameplay.behaviour]
rest_y = 620
rise_ms = 1320
rest_ms = 1200
enraged_rest_ms = 600
signal_ms = 600
gale_ms = 1200
gust_gap_ms = 300
blades_ms = 2600
crack_ms = 1400
pump_ms = 420
tatters = 6
veil_ms = 720
recover_ms = 480
calm_ms = 1200

[gameplay.health]
points = 300

[gameplay.score]
points = 20000

[gameplay.boss]
rage_below_percent = 50
rage_attack = 5
arrival_attack = 4

[gameplay.stays_outside]

[gameplay.survives_contact]

[appearance]
sheet = "sprites/deseret/old_widow.png"
boss_name = "THE OLD WIDOW"
boss_music = "music/stratosphere_boogie.mp3"

