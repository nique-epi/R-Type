# Sheol Mine, the fourth stage of Deseret: a timbered gallery under a
# ceiling of sandstone, lit by hanging kerosene lamps.
# Three layers cut from the map of its LDtk project, written by
# generator/procedural/; the background arrives through its nearest layer.

[[layer]]
name = "far plane"
motion = { parallax = 0.25 }
tiles = { project = "biomes/deseret_mine/deseret_mine.ldtk", layer = "Far", tileset = "biomes/deseret_mine/deseret_mine_far.png" }

[[layer]]
name = "middle plane"
motion = { parallax = 0.5 }
tiles = { project = "biomes/deseret_mine/deseret_mine.ldtk", layer = "Mid", tileset = "biomes/deseret_mine/deseret_mine_mid.png" }

[[layer]]
name = "near plane"
motion = { parallax = 1 }
entrance = true
tiles = { project = "biomes/deseret_mine/deseret_mine.ldtk", layer = "Near", tileset = "biomes/deseret_mine/deseret_mine_near.png" }
