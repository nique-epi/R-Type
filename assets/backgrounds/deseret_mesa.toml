# Widow's Mesa, the last stage of Deseret: the homesteads at the top of
# the mesa, where the Old Widow turns, with no ceiling.
# Three layers cut from the map of its LDtk project, written by
# generator/procedural/; the background arrives through its nearest layer.

[[layer]]
name = "far plane"
motion = { parallax = 0.25 }
tiles = { project = "biomes/deseret_mesa/deseret_mesa.ldtk", layer = "Far", tileset = "biomes/deseret_mesa/deseret_mesa_far.png" }

[[layer]]
name = "middle plane"
motion = { parallax = 0.5 }
tiles = { project = "biomes/deseret_mesa/deseret_mesa.ldtk", layer = "Mid", tileset = "biomes/deseret_mesa/deseret_mesa_mid.png" }

[[layer]]
name = "near plane"
motion = { parallax = 1 }
entrance = true
tiles = { project = "biomes/deseret_mesa/deseret_mesa.ldtk", layer = "Near", tileset = "biomes/deseret_mesa/deseret_mesa_near.png" }
