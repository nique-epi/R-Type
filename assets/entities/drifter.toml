# The entity type drifter: a Bydo that crosses the playfield on its row.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/drifter.toml in the assets folder next to their executable, or one
# level above it: the name of the file is the name of the type. Each one reads
# only its own table, and stops with an error naming the file, the line and the
# key when a key is missing, misspelt, out of its range, or does not hold
# together with another key or another sheet. Every number is an integer: 240,
# never 240.0. The keys are described on the page "Writing an entity sheet" of
# the docs.

[gameplay]
side = "enemy"
pilot = "straight"

[gameplay.hitbox]
width = 96
height = 96

[gameplay.motion]
kind = "steady"
top_speed = 240

[gameplay.behaviour]
heading = -1

[gameplay.health]
points = 3

[gameplay.score]
points = 100

[gameplay.gun]
interval_ms = 1500
first_shot_ms = 1500
projectile = "enemy_missile"

[appearance]
sheet = "sprites/entities.png"

[appearance.idle]
left = 0
top = 72
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 250
