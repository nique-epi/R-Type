# The entity type drillback: an armoured Bydo beetle with a drill for a horn
# that drifts with the sky, shakes, charges straight ahead, then stays stunned.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/drillback.toml in the assets folder next to their executable, or
# one level above it: the name of the file is the name of the type. Each one
# reads only its own table, and stops with an error naming the file, the line
# and the key when a key is missing, misspelt, out of its range, or does not
# hold together with another key or another sheet. Every number is an integer:
# 240, never 240.0. The keys are described on the page "Writing an entity
# sheet" of the docs.

[gameplay]
side = "enemy"
pilot = "drillback"

[gameplay.hitbox]
width = 96
height = 96

# Its charge: 280 sheet pixels a second, 4 units a pixel.
[gameplay.motion]
kind = "steady"
top_speed = 1120

# It drifts with the sky at 120 units a second. Once left of 1824, wholly on
# screen, and 600 ms after its last action, it shakes for 600 ms, charges for
# 700 ms (784 units), then is stunned for 900 ms.
[gameplay.behaviour]
drift_speed = 120
enter_x = 1824
rest_ms = 600
signal_ms = 600
strike_ms = 700
recover_ms = 900

# Four shots, but one while it is stunned.
[gameplay.health]
points = 4

[gameplay.fragile]
attack = 0
phase = "recover"

[gameplay.score]
points = 300

# A ram: a ship that touches it is lost, and the beetle goes on.
[gameplay.survives_contact]

[appearance]
sheet = "sprites/mobs/drillback.png"

[appearance.idle]
left = 0
top = 0
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 200

# Shaking, until the charge.
[appearance.attack_0.signal]
left = 0
top = 26
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 60
playback = "loop"
afterwards = "stay"

# The charge, 40 pixels wide: the body in the 24 on the left and the speed
# lines behind it, so the frame hangs 8 pixels to the right of the body.
[appearance.attack_0.strike]
left = 0
top = 52
width = 40
height = 24
frames = 2
spacing = 2
frame_ms = 60
playback = "loop"
afterwards = "stay"
anchor_x = 8
anchor_y = 0

# Stunned, four frames of 225 ms for the 900 ms of the stun, then idle.
[appearance.attack_0.recover]
left = 0
top = 78
width = 24
height = 24
frames = 4
spacing = 2
frame_ms = 225
playback = "once"
afterwards = "idle"

# The death, 48 by 48 pixels centered on the body, played once instead of the
# Bydo explosion; the row right under it holds the same death without flash.
[appearance.death]
left = 0
top = 104
width = 48
height = 48
frames = 6
spacing = 2
frame_ms = 70
