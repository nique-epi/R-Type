distance = 8

# Brood: a mix of mobs in front of it, never on it nor behind it (its body
# ends about 260 units left of its center), drawn anew at each brood: a
# Weaver always, then each other one with its chance_percent, each at a
# point moved at random by up to jitter_x and jitter_y. Two divers come in
# from the top and the bottom edges and fly straight down-left or up-left
# at 28 degrees, which takes them to the left edge before the other one.
# Enraged, every chance is higher. Each mob keeps the path of its sheet.
