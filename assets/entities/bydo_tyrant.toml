# The entity type bydo_tyrant: the final boss, a giant Bydo with a skull. It
# arrives once the last wave of a difficulty that names it is over, slides in
# and roars, then bursts missiles, sweeps beams, lays Bydos and spores, lashes
# its tentacles at a ship under its jaw, and enrages below half its health.
# A shot anywhere on its body hurts it; its body destroys a ship that
# touches it.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/bydo_tyrant.toml in the assets folder next to their executable, or
# one level above it: the name of the file is the name of the type. Each one
# reads only its own table, and stops with an error naming the file, the line
# and the key when a key is missing, misspelt, out of its range, or does not
# hold together with another key or another sheet. Every number is an integer:
# 240, never 240.0. The keys are described on the page "Writing an entity
# sheet" of the docs.

[gameplay]
side = "enemy"
pilot = "bydo_tyrant"

# Its body, skull and legs included: the opaque pixels of its idle frame run
# from column 12 to 122 and from row 4 to 126 of the 128-pixel frame, so the
# box is 110 by 122 sheet pixels, 3 right of and 1 below the center.
[gameplay.hitbox]
width = 440
height = 488
offset_x = 12
offset_y = 4

# Fast enough for its charge: 1936 units out in 800 ms.
[gameplay.motion]
kind = "steady"
top_speed = 2500

[gameplay.behaviour]
rest_x = 1616
rest_ms = 1000
slide_ms = 1800
roar_ms = 800
settle_ms = 0
burst_signal_ms = 600
burst_strike_ms = 200
burst_recover_ms = 300
beam_signal_ms = 800
beam_strike_ms = 600
beam_recover_ms = 300
brood_signal_ms = 800
brood_strike_ms = 200
brood_recover_ms = 300
tentacle_signal_ms = 300
tentacle_strike_ms = 400
tentacle_recover_ms = 300
# 40 sheet pixels (160 units) from its tentacles, plus their half height.
melee_x = -136
melee_y = 168
melee_reach = 248
rage_ms = 700
rage_signal_percent = 70
sweep_signal_ms = 560
sweep_strike_ms = 1200
sweep_recover_ms = 300
spores_signal_ms = 560
spores_strike_ms = 200
spores_recover_ms = 300
wall_signal_ms = 560
wall_strike_ms = 200
wall_recover_ms = 300
charge_signal_ms = 700
charge_strike_ms = 1600
charge_recover_ms = 1000

[gameplay.health]
points = 240

[gameplay.score]
points = 10000

[gameplay.boss]
rage_below_percent = 50
rage_attack = 9
arrival_attack = 0

[gameplay.survives_contact]

# Burst: 5 missiles fanned over 48 degrees from the mouth; enraged, 7.
[[gameplay.volley]]
attack = 1
phase = "strike"
body = "tyrant_missile"
count = 5
offset_x = -124
offset_y = 44
spread_deg = 48
distance = 8

[[gameplay.volley]]
attack = 11
phase = "strike"
body = "tyrant_missile"
