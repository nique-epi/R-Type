# The entity type crystal_blue: the crystal of the blue weapon, which an
# enemy drops; the ship that picks it up holds the blue weapon, or its second
# level when it already held it.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/crystal_blue.toml in the assets folder next to their executable,
# or one level above it: the name of the file is the name of the type. Each one
# reads only its own table, and stops with an error naming the file, the line
# and the key when a key is missing, misspelt, out of its range, or does not
# hold together with another key or another sheet. Every number is an integer:
# 240, never 240.0. The keys are described on the page "Writing an entity
# sheet" of the docs. Its appearance is the one of look_crown until it is
# drawn.

[gameplay]
side = "crystal"
layer = "crystal"
hits = ["player"]
crystal = "blue"
pilot = "straight"

[gameplay.hitbox]
width = 48
height = 32

[gameplay.motion]
kind = "steady"
top_speed = 120

[gameplay.behaviour]
heading = -1

[appearance]
sheet = "sprites/looks.png"

[appearance.idle]
left = 36
top = 0
width = 12
height = 8
frames = 1
spacing = 0
frame_ms = 1000
