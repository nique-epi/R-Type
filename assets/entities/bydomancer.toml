# The entity type bydomancer: a Bydo mage that stands at the back of the
# playfield, casts rune orbs that weave and burst, and casts a nova at a ship
# that comes close; once hit, it leaps to another row.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/bydomancer.toml in the assets folder next to their executable, or one
# level above it: the name of the file is the name of the type. Each one reads
# only its own table, and stops with an error naming the file, the line and the
# key when a key is missing, misspelt, out of its range, or does not hold
# together with another key or another sheet. Every number is an integer: 240,
# never 240.0. The keys are described on the page "Writing an entity sheet" of
# the docs.

[gameplay]
side = "enemy"
pilot = "bydomancer"

[gameplay.hitbox]
width = 96
height = 96

[gameplay.motion]
kind = "steady"
top_speed = 240

# It stops at 1600 and bobs one sheet pixel (4 units) above and below its row
# every second; once wounded it leaps 400 units towards the middle, once.
# Rested 1500 ms, it raises its staff 300 ms, casts 120 ms (one orb), then
# rests its empty staff 300 ms. A ship whose center comes within 192 units of
# its own (its half, 20 sheet pixels and the half height of a ship: 48 + 80 +
# 32, rounded up to whole pixels) makes it cast its nova, 240 ms, once it
# has been idle 1500 ms.
[gameplay.behaviour]
stand_x = 1600
jump = 400
bob = 4
bob_period_ms = 1000
rest_ms = 1500
signal_ms = 300
strike_ms = 120
recover_ms = 300
nova_reach = 192
nova_ms = 240
nova_rest_ms = 1500

[gameplay.health]
points = 3

[gameplay.score]
points = 300

# One orb a cast: the gun is ready at once and waits a second, longer than a
# strike, so the cast fires once.
[gameplay.gun]
interval_ms = 1000
first_shot_ms = 0
projectile = "rune_orb"

# The ring of the nova, frame by frame: radius 7, 12 then 17 sheet pixels
# (diameters 60, 100 and 140 units), each drawn as a cross of two boxes.
[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = 0
width = 60
height = 36
attack = 1
phase = "strike"
from_ms = 0
until_ms = 80

[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = 0
width = 36
height = 60
attack = 1
phase = "strike"
from_ms = 0
until_ms = 80

[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = 0
width = 100
height = 60
attack = 1
phase = "strike"
from_ms = 80
until_ms = 160

[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = 0
width = 60
height = 100
attack = 1
phase = "strike"
from_ms = 80
until_ms = 160

[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = 0
width = 140
height = 84
attack = 1
phase = "strike"
from_ms = 160

[[gameplay.hurt_zone.box]]
offset_x = 0
offset_y = 0
width = 84
height = 140
attack = 1
phase = "strike"
from_ms = 160

[appearance]
sheet = "sprites/mobs/bydomancer.png"

[appearance.idle]
left = 0
top = 0
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 250

# The staff raised, the orb growing, until the cast.
[appearance.attack_0.signal]
left = 0
top = 26
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 150
playback = "hold"
afterwards = "stay"

# The cast, 30 pixels wide: the body in the 24 on the right, so the frame
# hangs 3 pixels to the left of the center of the body.
[appearance.attack_0.strike]
left = 0
top = 52
width = 30
height = 24
frames = 1
spacing = 2
frame_ms = 120
playback = "hold"
afterwards = "stay"
anchor_x = -3
anchor_y = 0

# The empty staff, then the idle frames again.
[appearance.attack_0.recover]
left = 0
top = 78
width = 24
height = 24
frames = 1
spacing = 2
frame_ms = 300
playback = "once"
afterwards = "idle"

# The nova, 41 by 41 pixels, the body at its center.
[appearance.attack_1.strike]
left = 0
top = 122
width = 41
height = 41
frames = 3
spacing = 2
frame_ms = 80
playback = "once"
afterwards = "idle"
