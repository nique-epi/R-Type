# The entity type rune_orb: the rune orb a Bydomancer casts: it weaves to the
# left, then bursts into four shards.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/rune_orb.toml in the assets folder next to their executable, or one
# level above it: the name of the file is the name of the type. Each one reads
# only its own table, and stops with an error naming the file, the line and the
# key when a key is missing, misspelt, out of its range, or does not hold
# together with another key or another sheet. Every number is an integer: 240,
# never 240.0. The keys are described on the page "Writing an entity sheet" of
# the docs.

[gameplay]
side = "enemy_missile"
pilot = "weave"

[gameplay.hitbox]
width = 36
height = 36

[gameplay.motion]
kind = "steady"
top_speed = 360

# 48 units above and below its row, every 1800 ms: about three bumps over the
# width of the playfield.
[gameplay.behaviour]
amplitude = 48
period_ms = 1800

# After 1500 ms (540 units), it bursts into four shards along the diagonals.
[gameplay.burst]
after_ms = 1500
count = 4
shard = "orb_shard"

[appearance]
sheet = "sprites/mobs/bydomancer.png"

[appearance.idle]
left = 0
top = 104
width = 9
height = 9
frames = 2
spacing = 2
frame_ms = 120
