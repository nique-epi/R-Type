# The entity type ship: the ship of a player.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/ship.toml in the assets folder next to their executable, or one level
# above it: the name of the file is the name of the type. Each one reads only
# its own table, and stops with an error naming the file, the line and the key
# when a key is missing, misspelt, out of its range, or does not hold together
# with another key or another sheet. Every number is an integer: 240, never
# 240.0. The keys are described on the page "Writing an entity sheet" of the
# docs.

[gameplay]
side = "player"
layer = "player"
hits = ["look_item"]
pilot = "player"

[gameplay.hitbox]
width = 128
height = 64

[gameplay.motion]
kind = "ship"

[gameplay.gun]
interval_ms = 333
first_shot_ms = 0
projectile = "player_missile"

[gameplay.mask]
erosion = 1
rows = [
  "................................",
  "................................",
  "..............#####.............",
  "............######..............",
  "...........########.............",
  "..####################..........",
  ".#########################......",
  ".#############################..",
  ".#############################..",
  ".#########################......",
  "..####################..........",
  "...........########.............",
  "............######..............",
  "..............#####.............",
  "................................",
  "................................",
]

[appearance]
sheet = "sprites/entities.png"

[appearance.idle]
left = 0
top = 0
width = 32
height = 16
frames = 2
spacing = 2
frame_ms = 80
