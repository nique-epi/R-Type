# The entity type tyrant_spore: a spore mine the enraged Bydo Tyrant lays
# across the playfield; it bursts into four shards along the diagonals.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/tyrant_spore.toml in the assets folder next to their executable, or one
# level above it: the name of the file is the name of the type. Each one reads
# only its own table, and stops with an error naming the file, the line and the
# key when a key is missing, misspelt, out of its range, or does not hold
# together with another key or another sheet. Every number is an integer: 240,
# never 240.0. The keys are described on the page "Writing an entity sheet" of
# the docs.

[gameplay]
side = "enemy_missile"
layer = "enemy_missile"
hits = ["player"]
pilot = "straight"

[gameplay.hitbox]
width = 36
height = 36

# A mine: it barely drifts (1 unit a second) until it bursts.
[gameplay.motion]
kind = "steady"
top_speed = 1

[gameplay.behaviour]
heading = -1

# After 1100 ms, it bursts into four shards along the diagonals.
[gameplay.burst]
after_ms = 1100
count = 4
shard = "tyrant_spore_shard"

[gameplay.mask]
rows = [
  "...###...",
  ".#######.",
  ".#######.",
  "#########",
  "#########",
  "#########",
  ".#######.",
  ".#######.",
  "...###...",
]

[appearance]
sheet = "sprites/mobs/bydo_tyrant.png"

[appearance.idle]
left = 0
top = 1950
width = 9
height = 9
frames = 2
spacing = 2
frame_ms = 200
