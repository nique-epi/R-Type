# The entity type crystal_carrier: a Bydo that drops a crystal when a missile
# kills it, red, blue or yellow by turns.
# [gameplay] is what the server gives an entity of this type, [appearance] how
# the client draws it. Both programs read this file when they start, from
# entities/crystal_carrier.toml in the assets folder next to their executable,
# or one level above it: the name of the file is the name of the type. Each one
# reads only its own table, and stops with an error naming the file, the line
# and the key when a key is missing, misspelt, out of its range, or does not
# hold together with another key or another sheet. Every number is an integer:
# 240, never 240.0. The keys are described on the page "Writing an entity
# sheet" of the docs.

[gameplay]
side = "enemy"
layer = "enemy"
hits = ["player"]
pilot = "straight"
drops = ["crystal_red", "crystal_blue", "crystal_yellow"]

[gameplay.hitbox]
width = 96
height = 96

[gameplay.motion]
kind = "steady"
top_speed = 180

[gameplay.behaviour]
heading = -1

[gameplay.health]
points = 4

[gameplay.score]
points = 150

[appearance]
sheet = "sprites/mobs/crystal_carrier.png"

[appearance.idle]
left = 0
top = 0
width = 24
height = 24
frames = 2
spacing = 2
frame_ms = 250

# The death, 48 by 48 pixels centered on the body, played once instead of the
# Bydo explosion; the row right under it holds the same death without flash.
[appearance.death]
left = 0
top = 26
width = 48
height = 48
frames = 6
spacing = 2
frame_ms = 70
